name: Build rexglue-sdk teest fix linux arm64 (WIP)

on:
  workflow_dispatch:

  push:
    branches:
      - test-arm64

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install clang 20
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            gnupg \
            lsb-release

          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh

          sudo ./llvm.sh 20

          sudo apt-get install -y \
            clang-20 \
            lld-20

          sudo update-alternatives \
            --install /usr/bin/clang clang /usr/bin/clang-20 200

          sudo update-alternatives \
            --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            git \
            curl \
            unzip \
            zip \
            autoconf \
            python3.12-venv \
            libgtk-3-dev \
            libx11-xcb-dev \
            libxss-dev \
            libvulkan-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libxkbcommon-dev \
            libdecor-0-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev

      - name: Set up sccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          variant: sccache
          key: linux-arm64-test

      - name: Show toolchain
        run: |
          uname -a
          echo
          clang-20 --version
          echo
          clang++-20 --version
          echo
          cmake --version

      - name: Configure
        env:
          CC: clang-20
          CXX: clang++-20
        run: |
          cmake \
            --preset linux-arm64 \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build and install
        run: |
          cmake \
            --build out/build/linux-arm64 \
            --target install \
            --parallel

      - name: sccache stats
        if: always()
        shell: bash
        run: |
          sccache --show-stats || true

      - name: Read version
        id: version
        shell: bash
        run: |
          v=$(sed -nE \
            's/^#define REXGLUE_VERSION_STRING "([^"]+)".*/\1/p' \
            out/build/linux-arm64/include/rex/version.h)

          echo "Detected version: ${v}"

          if [ -z "${v}" ]; then
            echo "ERROR: Could not determine REXGLUE_VERSION_STRING"
            exit 1
          fi

          echo "v=${v}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          cd out/install

          zip -r \
            "rexglue-sdk-${{ steps.version.outputs.v }}-linux-arm64.zip" \
            linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rexglue-sdk-linux-arm64-test
          path: out/install/rexglue-sdk-*-linux-arm64.zip
          retention-days: 14
